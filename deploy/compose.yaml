services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: qlt-backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - qlt-network

  caddy:
    image: caddy:2-alpine
    container_name: qlt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qlt-network

networks:
  qlt-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
