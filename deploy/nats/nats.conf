# NATS Server Configuration for Quản lý Tao (Single-node ARM64 / Mac mini M1)
server_name: "qlt-nats-primary"
host: $NATS_HOST
port: 4222
http: $NATS_MONITOR_LISTEN
authorization {
    users: [{ user: $NATS_USER, password: $NATS_PASSWORD }]
}

# JetStream configuration
jetstream {
    store_dir: $NATS_STORE_DIR
    max_mem: 512MB
    max_file: 5GB
    sync_interval: always
}

# Limits and timeouts
max_payload: 1MB
ping_interval: "20s"
ping_max: 5

# Logging
logtime: true
debug: false
trace: false
